name: Verify living world
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: world
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: living_world_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U world" --health-interval=3s --health-retries=20
    env:
      TEST_DATABASE_URL: postgres://world:test-only@localhost:5432/living_world_test
      E2E_DATABASE_URL: postgres://world:test-only@localhost:5432/living_world_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: TEST_DATABASE=1 NODE_ENV=test pnpm test
      - run: PGPASSWORD=test-only psql -h localhost -U world -d living_world_test -c 'CREATE DATABASE living_world_e2e'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
